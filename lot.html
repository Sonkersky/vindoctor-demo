<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Pojazdu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .details-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
        }

        h1 {
            margin-top: 0;
        }

        .main-gallery {
            margin-bottom: 20px;
        }

        .main-gallery img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 6px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 6px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .spec-value {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 3px;
        }

        .price-section {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-section .label {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .price-section .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Wróć do listy aut</a>
        
        <div id="carDetailsContainer" class="details-card">
            <p>Ładowanie szczegółów pojazdu...</p>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const vinParam = params.get('vin');

            const cachedData = localStorage.getItem('cachedCarsData');
            const container = document.getElementById('carDetailsContainer');

            if (!cachedData || !vinParam) {
                container.innerHTML = '<h2>Nie znaleziono danych pojazdu.</h2><p>Wróć do strony głównej i wybierz auto ponownie.</p>';
                return;
            }

            const cars = JSON.parse(cachedData);
            const car = cars.find(c => c.vin === vinParam);

            if (!car) {
                container.innerHTML = '<h2>Nie znaleziono pojazdu o podanym numerze VIN.</h2>';
                return;
            }

            const year = car.year || '';
            const title = car.title || `${year} ${car.make} ${car.model}`;
            const vin = car.vin || 'N/A';
            const location = car.location || 'USA';
            const odometer = car.odometer ? car.odometer.toLocaleString() + ' mi' : 'N/A';
            const status = car.status || 'Sold';
            const damage = car.damage_pr || 'N/A';
            const price = car.purchase_price ? `$${car.purchase_price.toLocaleString()} USD` : 'Zapytaj o cenę';
            const engine = car.engine || 'N/A';
            const transmission = car.transmission || 'N/A';
            const drive = car.drive || 'N/A';

            const imgSrc = (car.link_img_small && car.link_img_small.length > 0) 
                ? car.link_img_small[0] 
                : 'https://images.unsplash.com/photo-1590497008432-598f04441de8?auto=format&fit=crop&w=800&q=80';

            container.innerHTML = `
                <h1>${title}</h1>
                <p style="color: var(--text-muted); margin-top: -5px;">Numer VIN: <strong>${vin}</strong></p>
                
                <div class="main-gallery">
                    <img src="${imgSrc}" alt="${title}">
                </div>

                <div class="specs-grid">
                    <div class="spec-item"><span class="spec-label">Lokalizacja</span><span class="spec-value">${location}</span></div>
                    <div class="spec-item"><span class="spec-label">Przebieg</span><span class="spec-value">${odometer}</span></div>
                    <div class="spec-item"><span class="spec-label">Uszkodzenie</span><span class="spec-value">${damage}</span></div>
                    <div class="spec-item"><span class="spec-label">Status licytacji</span><span class="spec-value">${status}</span></div>
                    <div class="spec-item"><span class="spec-label">Silnik</span><span class="spec-value">${engine}</span></div>
                    <div class="spec-item"><span class="spec-label">Skrzynia biegów</span><span class="spec-value">${transmission}</span></div>
                    <div class="spec-item"><span class="spec-label">Napęd</span><span class="spec-value">${drive}</span></div>
                    <div class="spec-item"><span class="spec-label">Portal licytacyjny</span><span class="spec-value" style="text-transform:uppercase;">${car.base_site || 'N/A'}</span></div>
                </div>

                <div class="price-section">
                    <span class="label">Ostateczna cena sprzedaży:</span>
                    <span class="value">${price}</span>
                </div>
            `;
        });
    </script>
</body>
</html>
