<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details - VINDOCTOR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px 20px 0 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            height: 45px;
            width: auto;
        }

        .lot-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-bottom: 50px;
        }

        .main-image-box {
            width: 100%;
            height: 450px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }

        .main-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lot-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            height: fit-content;
        }

        .lot-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
        }

        .lot-vin {
            color: #38bdf8;
            font-family: monospace;
            font-size: 1rem;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .specs-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            padding-bottom: 8px;
            border-bottom: 1px dashed #334155;
        }

        .spec-label { color: #94a3b8; }
        .spec-value { color: #fff; font-weight: 600; }

        .price-box {
            background-color: #0f172a;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .price-box .price-title { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        .price-box .price-amount { font-size: 1.8rem; font-weight: 800; color: #38bdf8; }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
        }

        .site-footer {
            background-color: #0b1120;
            border-top: 1px solid #1e293b;
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: auto;
        }

        @media (max-width: 900px) {
            .lot-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-logo">
            <a href="index.html">
                <img src="logo_2.png" alt="VINDOCTOR" class="logo-img">
            </a>
        </div>

        <a href="index.html" class="back-btn">← Back to Search</a>

        <div class="lot-layout">
            <div>
                <div class="main-image-box">
                    <img id="carImage" src="https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?auto=format&fit=crop&w=1200&q=80" alt="Vehicle Image">
                </div>
            </div>

            <div class="lot-card">
                <h1 class="lot-title" id="carTitle">2022 Ford Mustang GT</h1>
                <div class="lot-vin" id="carVin">VIN: 1FA6P8CF5M5123456</div>

                <div class="specs-list">
                    <div class="spec-row"><span class="spec-label">Auction:</span><span class="spec-value" id="carAuction">COPART</span></div>
                    <div class="spec-row"><span class="spec-label">Location:</span><span class="spec-value" id="carLocation">FL - TAMPA</span></div>
                    <div class="spec-row"><span class="spec-label">Odometer:</span><span class="spec-value" id="carOdometer">18,400 mi</span></div>
                    <div class="spec-row"><span class="spec-label">Vehicle Status:</span><span class="spec-value" id="carStatus" style="color:#22c55e;">Run & Drive</span></div>
                    <div class="spec-row"><span class="spec-label">Primary Damage:</span><span class="spec-value" id="carDamage">Front End</span></div>
                </div>

                <div class="price-box">
                    <div class="price-title">Final Auction Price</div>
                    <div class="price-amount" id="carPrice">$14,200 USD</div>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        Ⓒ 2026 VINDOCTOR. All rights reserved
    </footer>

    <script>
        const mockDatabase = {
            "1FA6P8CF5M5123456": {
                title: "2022 Ford Mustang GT",
                auction: "COPART",
                location: "FL - TAMPA",
                odometer: "18,400 mi",
                status: "Run & Drive",
                damage: "Front End",
                price: "$14,200 USD",
                imageUrl: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?auto=format&fit=crop&w=1200&q=80"
            },
            "WBS83AY000CK99887": {
                title: "2021 BMW M4 Competition",
                auction: "IAAI",
                location: "CA - LOS ANGELES",
                odometer: "24,100 mi",
                status: "Stationary",
                damage: "Side / Rear",
                price: "$22,800 USD",
                imageUrl: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=1200&q=80"
            },
            "2C3CDABT8KH654321": {
                title: "2023 Dodge Challenger R/T",
                auction: "COPART",
                location: "TX - DALLAS",
                odometer: "9,800 mi",
                status: "Run & Drive",
                damage: "Hail",
                price: "$18,500 USD",
                imageUrl: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1200&q=80"
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const vin = urlParams.get('vin');

            if (vin && mockDatabase[vin]) {
                const data = mockDatabase[vin];
                document.getElementById('carTitle').textContent = data.title;
                document.getElementById('carVin').textContent = "VIN: " + vin;
                document.getElementById('carAuction').textContent = data.auction;
                document.getElementById('carLocation').textContent = data.location;
                document.getElementById('carOdometer').textContent = data.odometer;
                document.getElementById('carStatus').textContent = data.status;
                document.getElementById('carDamage').textContent = data.damage;
                document.getElementById('carPrice').textContent = data.price;
                document.getElementById('carImage').src = data.imageUrl;
            } else if (vin) {
                document.getElementById('carVin').textContent = "VIN: " + vin;
                document.getElementById('carTitle').textContent = "Vehicle Data Found";
            }
        });
    </script>
</body>
</html>
