<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Auction Details - VINDOCTOR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            position: relative;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 16px;
        }

        .logo-img {
            height: 40px;
            width: auto;
            display: block;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: rgba(30, 41, 59, 0.8);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
        }

        .claim-btn {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .car-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .car-title-main {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .vin-pill {
            display: inline-block;
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            color: #94a3b8;
            margin-top: 8px;
        }

        .auction-badge {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .auction-badge.copart { background-color: #0053a0; color: #ffffff; }
        .auction-badge.iaai { background-color: #dc2626; color: #ffffff; }

        .details-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 32px;
            margin-bottom: 32px;
        }

        @media (max-width: 900px) {
            .details-layout { grid-template-columns: 1fr; }
        }

        .gallery-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* STYL DLA POZYCJONOWANIA ZNAKU WODNEGO */
        .main-image-container {
            position: relative;
            width: 100%;
            height: 420px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .main-image-container img.main-car-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .watermark {
            position: absolute;
            bottom: 12px;
            right: 12px;
            height: 32px;
            width: auto;
            opacity: 0.7;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            z-index: 5;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(15, 23, 42, 0.7);
            color: #ffffff;
            border: 1px solid #334155;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 6;
        }

        .nav-arrow.prev { left: 12px; }
        .nav-arrow.next { right: 12px; }

        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .thumb {
            position: relative;
            height: 80px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .thumb.active, .thumb:hover { border-color: #38bdf8; }
        .thumb img.thumb-car-img { width: 100%; height: 100%; object-fit: cover; }
        .thumb .watermark { height: 14px; bottom: 4px; right: 4px; opacity: 0.5; }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .price-box {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-box .amount { font-size: 2.2rem; font-weight: 800; color: #38bdf8; }

        .specs-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
        }

        .specs-card h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #ffffff;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .specs-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 20px;
        }

        .spec-item { display: flex; flex-direction: column; }
        .spec-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 700; }
        .spec-value { font-size: 0.95rem; color: #cbd5e1; font-weight: 600; }
        .highlight-green { color: #22c55e; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-logo">
            <a href="index.html">
                <img src="logo_2.png" alt="VINDOCTOR" class="logo-img">
            </a>
        </div>

        <div class="top-bar">
            <a href="index.html" class="back-link">← Back to listings</a>
            <button class="claim-btn">Claim This Lot</button>
        </div>

        <div class="car-header">
            <div>
                <h1 class="car-title-main" id="carTitle">Loading...</h1>
                <div class="vin-pill" id="carVin">VIN: ---</div>
            </div>
            <span class="auction-badge copart" id="carAuctionBadge">COPART</span>
        </div>

        <div class="details-layout">
            <div class="gallery-section">
                <div class="main-image-container">
                    <button class="nav-arrow prev" onclick="prevImage()">❮</button>
                    <img id="mainImage" class="main-car-img" src="" alt="Main Image">
                    <button class="nav-arrow next" onclick="nextImage()">❯</button>
                    <!-- AUTOMATYCZNY WATERMARK -->
                    <img src="logo_2.png" class="watermark" alt="Watermark">
                </div>
                <div class="thumbnails-grid" id="thumbsGrid"></div>
            </div>

            <div class="info-section">
                <div class="price-box">
                    <div>
                        <div style="font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Final Auction Price</div>
                    </div>
                    <div class="amount" id="carPrice">$0 USD</div>
                </div>

                <div class="specs-card">
                    <h3>Vehicle Specifications</h3>
                    <div class="specs-list">
                        <div class="spec-item"><span class="spec-label">Location</span><span class="spec-value" id="specLocation">-</span></div>
                        <div class="spec-item"><span class="spec-label">Sale Date</span><span class="spec-value" id="specDate">-</span></div>
                        <div class="spec-item"><span class="spec-label">Engine Status</span><span class="spec-value highlight-green" id="specStatus">-</span></div>
                        <div class="spec-item"><span class="spec-label">Primary Damage</span><span class="spec-value" id="specDamage">-</span></div>
                        <div class="spec-item"><span class="spec-label">Sale Document</span><span class="spec-value" id="specDoc">-</span></div>
                        <div class="spec-item"><span class="spec-label">Odometer</span><span class="spec-value" id="specOdometer">-</span></div>
                        <div class="spec-item"><span class="spec-label">Seller</span><span class="spec-value" id="specSeller">-</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const carDatabase = [

            {

            },
            {
                vin: "WDDYJ8DA4KA334455",
                title: "2019 Mercedes-AMG GT R",
                auction: "iaai",
                price: "$52,000 USD",
                location: "IL - CHICAGO",
                date: "08/02/2026",

                document: "Certificate of Destruction",

            },
            {
                vin: "5YJSA1E20MF991122",
                title: "2022 Tesla Model S Plaid",
                auction: "copart",
                price: "$34,900 USD",
                location: "NV - LAS VEGAS",
                date: "08/03/2026",
                status: "Run & Drive",
                damage: "Rear End",
                document: "Clean Title",
                odometer: "15,300 mi",
                seller: "Travelers Ins.",
                images: ["https://picsum.photos/id/184/800/600"]
            }
        ];

        let currentCarImages = [];
        let currentIndex = 0;

        function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            let vinParam = urlParams.get('vin') || urlParams.get('VIN');

            let car = null;
            if (vinParam) {
                vinParam = vinParam.trim().toLowerCase();
                car = carDatabase.find(c => c.vin.toLowerCase() === vinParam);
            }

            if (!car) {
                car = carDatabase[0];
            }

            document.title = `${car.title} - VINDOCTOR`;
            document.getElementById('carTitle').innerText = car.title;
            document.getElementById('carVin').innerText = `VIN: ${car.vin}`;
            
            const badge = document.getElementById('carAuctionBadge');
            badge.innerText = car.auction.toUpperCase();
            badge.className = `auction-badge ${car.auction}`;

            document.getElementById('carPrice').innerText = car.price;
            document.getElementById('specLocation').innerText = car.location;
            document.getElementById('specDate').innerText = car.date;
            document.getElementById('specStatus').innerText = car.status;
            document.getElementById('specDamage').innerText = car.damage;
            document.getElementById('specDoc').innerText = car.document;
            document.getElementById('specOdometer').innerText = car.odometer;
            document.getElementById('specSeller').innerText = car.seller;

            currentCarImages = car.images;
            currentIndex = 0;

            renderGallery();
        }

        function renderGallery() {
            document.getElementById('mainImage').src = currentCarImages[currentIndex];
            const thumbsGrid = document.getElementById('thumbsGrid');
            
            thumbsGrid.innerHTML = currentCarImages.map((img, idx) => `
                <div class="thumb ${idx === currentIndex ? 'active' : ''}" onclick="setImage(${idx})">
                    <img src="${img}" class="thumb-car-img" alt="Photo ${idx + 1}">
                    <img src="logo_2.png" class="watermark" alt="Watermark">
                </div>
            `).join('');
        }

        function setImage(index) {
            currentIndex = index;
            renderGallery();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % currentCarImages.length;
            renderGallery();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + currentCarImages.length) % currentCarImages.length;
            renderGallery();
        }

        initPage();
    </script>
</body>
</html>
