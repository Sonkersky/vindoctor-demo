<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINDOCTOR - Vehicle Auction History</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 600px;
            background-image: url('https://images.unsplash.com/photo-1590497008432-598f04441de8?q=80&w=4091&auto=format&fit=crop');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 0.45;
            filter: contrast(110%) brightness(90%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-img {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .search-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
            margin-bottom: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
        }

        .filter-group input, .filter-group select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .filter-group input:focus, .filter-group select:focus {
            border-color: #38bdf8;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .car-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }

        .car-img-container {
            width: 100%;
            height: 180px;
            background-color: #0f172a;
            position: relative;
        }

        .car-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-auction {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            color: white;
        }

        .badge-auction.copart { background-color: #0053a0; }
        .badge-auction.iaai { background-color: #dc2626; }

        .car-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .car-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .car-vin {
            font-family: monospace;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .car-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        .car-price-row {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
        .price-val { font-size: 1.2rem; font-weight: 800; color: #38bdf8; }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-logo">
            <a href="index.html">
                <img src="logo_2.png" alt="VINDOCTOR" class="logo-img">
            </a>
        </div>

        <div class="search-card">
            <div class="filters-grid">
                <div class="filter-group">
                    <label>Search VIN / Title</label>
                    <input type="text" id="searchInput" placeholder="e.g. 1FA6P8CF5... or Mustang" oninput="filterCars()">
                </div>
                <div class="filter-group">
                    <label>Auction</label>
                    <select id="auctionSelect" onchange="filterCars()">
                        <option value="all">All Auctions</option>
                        <option value="copart">Copart</option>
                        <option value="iaai">IAAI</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="cars-grid" id="carsGrid">
            <div class="loading-state">Loading sold lots history from API...</div>
        </div>
    </div>

    <script>
        // WPISZ KLUCZ API PONIŻEJ
        const API_KEY = 'e9b16db5-1f33-4abb-81ca-aecad558b3ee'; 
        const API_URL = 'https://api.apicar.store/api/history/cars?size=100';

        let allCars = [];

        async function fetchHistoryCars() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'api-key': API_KEY,
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const resData = await response.json();
                allCars = resData.data || resData.cars || resData || [];

                renderCars(allCars);
            } catch (error) {
                console.error("Error fetching history cars:", error);
                document.getElementById('carsGrid').innerHTML = `
                    <div class="loading-state" style="color:#ef4444;">
                        Failed to load vehicle history. Check your API key or server status.
                    </div>`;
            }
        }

        function renderCars(cars) {
            const grid = document.getElementById('carsGrid');

            if (!cars || cars.length === 0) {
                grid.innerHTML = `<div class="loading-state">No sold vehicles found.</div>`;
                return;
            }

            grid.innerHTML = cars.map(car => {
                const vin = car.vin || '';
                const title = car.title || `${car.year || ''} ${car.make || ''} ${car.model || ''}`;
                const auction = (car.base_site || car.site || 'copart').toLowerCase();
                const price = car.final_bid || car.buy_it_now || car.price || 'N/A';
                
                let img = 'https://via.placeholder.com/400x300?text=No+Image';
                if (car.link_img_big && car.link_img_big.length > 0) img = car.link_img_big[0];
                else if (car.link_img_small && car.link_img_small.length > 0) img = car.link_img_small[0];
                else if (car.images && car.images.length > 0) img = car.images[0];

                return `
                    <a href="lot.html?vin=${encodeURIComponent(vin)}" class="car-card">
                        <div class="car-img-container">
                            <img src="${img}" alt="${title}">
                            <span class="badge-auction ${auction}">${auction.toUpperCase()}</span>
                        </div>
                        <div class="car-info">
                            <div class="car-title">${title}</div>
                            <div class="car-vin">VIN: ${vin}</div>
                            <div class="car-details">
                                <div>Odometer: ${car.odometer ? Number(car.odometer).toLocaleString() + ' mi' : 'N/A'}</div>
                                <div>Location: ${car.location || 'N/A'}</div>
                                <div>Damage: ${car.damage_pr || car.damage || 'N/A'}</div>
                                <div>Date: ${car.sale_date || car.date || 'N/A'}</div>
                            </div>
                            <div class="car-price-row">
                                <div>
                                    <div class="price-label">Final Price</div>
                                </div>
                                <div class="price-val">${price !== 'N/A' ? '$' + price : 'N/A'}</div>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function filterCars() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const auctionVal = document.getElementById('auctionSelect').value;

            const filtered = allCars.filter(car => {
                const title = (car.title || `${car.year || ''} ${car.make || ''} ${car.model || ''}`).toLowerCase();
                const vin = (car.vin || '').toLowerCase();
                const auction = (car.base_site || car.site || '').toLowerCase();

                const matchesSearch = title.includes(searchVal) || vin.includes(searchVal);
                const matchesAuction = auctionVal === 'all' || auction.includes(auctionVal);

                return matchesSearch && matchesAuction;
            });

            renderCars(filtered);
        }

        window.addEventListener('DOMContentLoaded', fetchHistoryCars);
    </script>
</body>
</html>
