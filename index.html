<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINDOCTOR - US Auto Auctions Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px 20px 0 20px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 600px;
            background-image: url('https://images.unsplash.com/photo-1590497008432-598f04441de8?q=80&w=4091&auto=format&fit=crop');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 0.45;
            filter: contrast(110%) brightness(90%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            flex-grow: 1;
            width: 100%;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            animation: logoPulse 5s infinite ease-in-out;
        }

        @keyframes logoPulse {
            0%, 85%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            }
            92% {
                transform: scale(1.06);
                filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
            }
        }

        .top-search-section {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .top-search-form {
            display: flex;
            gap: 10px;
        }

        .top-search-input {
            flex-grow: 1;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .top-search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
            align-items: start;
            margin-bottom: 50px;
        }

        .sidebar-filters {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            position: sticky;
            top: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .filter-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .filter-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
        }

        .filter-select, .filter-input-range {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #e2e8f0;
            font-size: 0.85rem;
            outline: none;
        }

        .filter-select:focus, .filter-input-range:focus {
            border-color: #38bdf8;
        }

        .range-group {
            display: flex;
            gap: 8px;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        .btn {
            padding: 11px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: #38bdf8; color: #0f172a; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        .btn-secondary { background-color: #334155; color: #cbd5e1; }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .car-tile {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .car-tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.6);
            border-color: #475569;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            background-color: #0f172a;
            display: block;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card-image-wrapper:hover .card-image { transform: scale(1.05); }

        .auction-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .auction-badge.copart { background-color: #0053a0; color: #ffffff; }
        .auction-badge.iaai { background-color: #dc2626; color: #ffffff; }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .car-title { font-size: 1.15rem; font-weight: 700; color: #ffffff; margin-bottom: 2px; }
        .vin-number { font-size: 0.8rem; color: #94a3b8; font-family: monospace; margin-bottom: 14px; }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px;
            padding-top: 10px;
            border-top: 1px solid #334155;
            margin-bottom: 14px;
        }

        .detail-item { display: flex; flex-direction: column; }
        .detail-label { font-size: 0.65rem; text-transform: uppercase; color: #64748b; font-weight: 600; }
        .detail-value { font-size: 0.8rem; color: #cbd5e1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-run-drive { color: #22c55e; font-weight: 600; }

        .card-footer {
            margin-top: auto;
            background-color: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-box-inner { display: flex; flex-direction: column; }
        .price-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .price-value { font-size: 1.1rem; font-weight: 800; color: #38bdf8; }

        .view-lot-btn {
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 8px 12px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .view-lot-btn:hover { background-color: #7dd3fc; transform: scale(1.02); }

        /* LOADER & NO RESULTS STATUSES */
        #statusMessage {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            background-color: #1e293b;
            border-radius: 12px;
            color: #94a3b8;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* FOOTER */
        .site-footer {
            background-color: #0b1120;
            border-top: 1px solid #1e293b;
            padding: 40px 20px 20px;
            margin-top: auto;
            position: relative;
            z-index: 2;
        }

        .footer-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-col { display: flex; flex-direction: column; gap: 12px; }
        .footer-logo { height: 32px; width: auto; align-self: flex-start; }
        .footer-text { color: #94a3b8; font-size: 0.85rem; line-height: 1.5; }
        .footer-email { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .footer-heading { color: #ffffff; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stats-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: #94a3b8; }
        .stats-list span { color: #f8fafc; font-weight: 700; }
        .footer-links { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .footer-links a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
        .footer-links a:hover { color: #38bdf8; }
        .footer-bottom { max-width: 1400px; margin: 0 auto; padding-top: 20px; border-top: 1px solid #1e293b; text-align: center; font-size: 0.8rem; color: #64748b; }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar-filters { position: static; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGO -->
        <div class="header-logo">
            <a href="index.html">
                <img src="logo_2.png" alt="VINDOCTOR" class="logo-img">
            </a>
        </div>

        <!-- TOP SEARCH BAR -->
        <div class="top-search-section">
            <form class="top-search-form" action="lot.html" method="GET">
                <input type="text" name="vin" class="top-search-input" placeholder="Enter VIN number (e.g. 1FA6P8CF5M5123456)" required>
                <button type="submit" class="btn btn-primary">Search VIN</button>
            </form>
        </div>

        <!-- MAIN LAYOUT -->
        <div class="main-layout">

            <!-- SIDEBAR FILTERS -->
            <aside class="sidebar-filters">
                <div class="filter-title">
                    <span>Filters</span>
                    <span style="font-size: 0.8rem; color: #38bdf8; cursor: pointer;" onclick="clearFilters()">Reset</span>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Auction House</label>
                    <select class="filter-select" id="filterAuction">
                        <option value="">All (Copart & IAAI)</option>
                        <option value="copart">Copart</option>
                        <option value="iaai">IAAI</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Make</label>
                    <select class="filter-select" id="filterMake" onchange="updateModelOptions()">
                        <option value="">All Makes</option>
                        <option value="ford">Ford</option>
                        <option value="bmw">BMW</option>
                        <option value="dodge">Dodge</option>
                        <option value="porsche">Porsche</option>
                        <option value="chevrolet">Chevrolet</option>
                        <option value="audi">Audi</option>
                        <option value="jeep">Jeep</option>
                        <option value="mercedes">Mercedes-Benz</option>
                        <option value="tesla">Tesla</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Model</label>
                    <select class="filter-select" id="filterModel">
                        <option value="">All Models</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Primary Damage</label>
                    <select class="filter-select" id="filterDamage">
                        <option value="">All Damage Types</option>
                        <option value="frontend">Front End</option>
                        <option value="rearend">Rear End</option>
                        <option value="side">Side / Side Damage</option>
                        <option value="hail">Hail</option>
                        <option value="flood">Water / Flood</option>
                        <option value="rollover">Rollover</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Vehicle Status</label>
                    <select class="filter-select" id="filterStatus">
                        <option value="">All Statuses</option>
                        <option value="run-drive">Run & Drive</option>
                        <option value="starts">Starts</option>
                        <option value="stationary">Stationary</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Year Range</label>
                    <div class="range-group">
                        <input type="number" class="filter-input-range" id="filterYearFrom" placeholder="From">
                        <input type="number" class="filter-input-range" id="filterYearTo" placeholder="To">
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Mileage Range (mi)</label>
                    <div class="range-group">
                        <input type="number" class="filter-input-range" id="filterMileageFrom" placeholder="Min mi">
                        <input type="number" class="filter-input-range" id="filterMileageTo" placeholder="Max mi">
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Location (State)</label>
                    <select class="filter-select" id="filterState">
                        <option value="">All States</option>
                        <option value="FL">Florida (FL)</option>
                        <option value="CA">California (CA)</option>
                        <option value="TX">Texas (TX)</option>
                        <option value="GA">Georgia (GA)</option>
                        <option value="NY">New York (NY)</option>
                        <option value="CO">Colorado (CO)</option>
                        <option value="IL">Illinois (IL)</option>
                        <option value="NV">Nevada (NV)</option>
                    </select>
                </div>

                <div class="sidebar-actions">
                    <button class="btn btn-primary" onclick="fetchCarsFromAPI()">Apply Filters</button>
                    <button class="btn btn-secondary" onclick="clearFilters()">Clear All</button>
                </div>
            </aside>

            <!-- VEHICLES GRID CONTAINER -->
            <main class="car-grid" id="carGrid">
                
                <!-- STATUS CONTAINER (Loader/Error/No Results) -->
                <div id="statusMessage"></div>

                <!-- DYNAMIC TILES WILL BE RENDERED HERE VIA JAVASCRIPT -->

            </main>
        </div>

    </div>

    <!-- STOPKA / FOOTER -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col">
                <a href="index.html">
                    <img src="logo_2.png" alt="VINDOCTOR Logo" class="footer-logo">
                </a>
                <p class="footer-text">
                    Got any questions?<br>
                    Feel free to contact<br>
                    <a href="mailto:info@vindoctor.com" class="footer-email">info@vindoctor.com</a>
                </p>
            </div>

            <div class="footer-col">
                <h4 class="footer-heading">Database Overview</h4>
                <ul class="stats-list">
                    <li>Lots: <span id="statTotalLots">-</span></li>
                    <li>Copart Lots: <span id="statCopartLots">-</span></li>
                    <li>IAAI Lots: <span id="statIaaiLots">-</span></li>
                </ul>
            </div>

            <div class="footer-col">
                <h4 class="footer-heading">Information</h4>
                <ul class="footer-links">
                    <li><a href="#">Terms & Conditions</a></li>
                    <li><a href="#">Privacy Policy</a></li>
                    <li><a href="#">VIN Lookup FAQ</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-bottom">
            Ⓒ 2026 VINDOCTOR. All rights reserved
        </div>
    </footer>

    <!-- LOGIKA POŁĄCZENIA Z API -->
    <script>
        // 1. ADRES TWOJEGO BACKENDOWEGO API (Zmień na swój port/domenę)
        const API_BASE_URL = 'https://api.twojadomena.com/v1'; // np. 'http://localhost:3000/api'

        const modelsByMake = {
            ford: [{ value: "mustang", text: "Mustang" }, { value: "f150", text: "F-150" }],
            bmw: [{ value: "m4", text: "M4" }, { value: "m3", text: "M3" }],
            dodge: [{ value: "challenger", text: "Challenger" }],
            porsche: [{ value: "911", text: "911" }],
            chevrolet: [{ value: "corvette", text: "Corvette" }],
            audi: [{ value: "rs6", text: "RS6" }],
            jeep: [{ value: "wrangler", text: "Wrangler" }],
            mercedes: [{ value: "gt", text: "AMG GT" }],
            tesla: [{ value: "models", text: "Model S" }]
        };

        function updateModelOptions() {
            const makeSelect = document.getElementById('filterMake');
            const modelSelect = document.getElementById('filterModel');
            const selectedMake = makeSelect.value;

            modelSelect.innerHTML = '<option value="">All Models</option>';

            if (selectedMake && modelsByMake[selectedMake]) {
                modelsByMake[selectedMake].forEach(model => {
                    const opt = document.createElement('option');
                    opt.value = model.value;
                    opt.textContent = model.text;
                    modelSelect.appendChild(opt);
                });
            }
        }

        // 2. FUNKCJA POBIERAJĄCA DANE Z API I RENDERUJĄCA KAFELKI
        async function fetchCarsFromAPI() {
            const gridContainer = document.getElementById('carGrid');
            const statusMsg = document.getElementById('statusMessage');

            // Pokazujemy loader i czyścimy stare kafelki
            statusMsg.style.display = 'block';
            statusMsg.innerHTML = '<div class="spinner"></div><p>Searching auction database...</p>';
            
            // Usuwamy istniejące kafelki pojazdów
            document.querySelectorAll('.car-tile').forEach(tile => tile.remove());

            // Budujemy parametry query zapytania REST API
            const params = new URLSearchParams();
            
            const auction = document.getElementById('filterAuction').value;
            const make = document.getElementById('filterMake').value;
            const model = document.getElementById('filterModel').value;
            const damage = document.getElementById('filterDamage').value;
            const status = document.getElementById('filterStatus').value;
            const state = document.getElementById('filterState').value;
            const yearFrom = document.getElementById('filterYearFrom').value;
            const yearTo = document.getElementById('filterYearTo').value;
            const mileageFrom = document.getElementById('filterMileageFrom').value;
            const mileageTo = document.getElementById('filterMileageTo').value;

            if (auction) params.append('auction', auction);
            if (make) params.append('make', make);
            if (model) params.append('model', model);
            if (damage) params.append('damage', damage);
            if (status) params.append('status', status);
            if (state) params.append('state', state);
            if (yearFrom) params.append('year_from', yearFrom);
            if (yearTo) params.append('year_to', yearTo);
            if (mileageFrom) params.append('mileage_from', mileageFrom);
            if (mileageTo) params.append('mileage_to', mileageTo);

            try {
                // Wywołanie endpointu (przykładowo: /api/cars?make=ford&auction=copart...)
                const response = await fetch(`${API_BASE_URL}/cars?${params.toString()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                /* 
                   Oczekiwany format JSON zwracany przez Twoje API:
                   {
                     "total": 1500,
                     "copartTotal": 900,
                     "iaaiTotal": 600,
                     "items": [
                        {
                          "title": "2022 Ford Mustang GT",
                          "vin": "1FA6P8CF5M5123456",
                          "auction": "copart",
                          "location": "FL - TAMPA",
                          "odometer": "18,400 mi",
                          "status": "Run & Drive",
                          "damage": "Front End",
                          "price": "$14,200 USD",
                          "imageUrl": "https://...",
                          "lotUrl": "lot.html?vin=1FA6P8CF5M5123456"
                        }
                     ]
                   }
                */

                statusMsg.style.display = 'none';

                if (!data.items || data.items.length === 0) {
                    statusMsg.style.display = 'block';
                    statusMsg.innerHTML = '<h3>No vehicles match your search criteria.</h3><p style="margin-top:8px;">Try clearing filters to see all available cars.</p>';
                    updateFooterStats(0, 0, 0);
                    return;
                }

                // Generowanie kafelków HTML z danych pobranych z API
                data.items.forEach(car => {
                    const tileHtml = createCarTileHTML(car);
                    gridContainer.insertAdjacentHTML('beforeend', tileHtml);
                });

                // Zaktualizowanie liczników w stopce
                updateFooterStats(data.total || data.items.length, data.copartTotal || 0, data.iaaiTotal || 0);

            } catch (error) {
                console.error("API Fetch Error:", error);
                statusMsg.style.display = 'block';
                statusMsg.innerHTML = '<h3>Unable to fetch vehicle data.</h3><p style="margin-top:8px; color: #ef4444;">Please check your internet connection or API endpoint setup.</p>';
            }
        }

        // 3. GENEROWANIE POJEDYNCZEGO KAFELKA NA PODSTAWIE OBIEKTU Z API
        function createCarTileHTML(car) {
            const isRunDrive = car.status && car.status.toLowerCase().includes('run');
            const statusClass = isRunDrive ? 'status-run-drive' : '';
            const auctionClass = car.auction ? car.auction.toLowerCase() : 'copart';

            return `
                <div class="car-tile">
                    <a href="${car.lotUrl || 'lot.html?vin=' + car.vin}" class="card-image-wrapper">
                        <img src="${car.imageUrl || 'https://via.placeholder.com/600x400'}" alt="${car.title}" class="card-image">
                        <span class="auction-badge ${auctionClass}">${car.auction.toUpperCase()}</span>
                    </a>
                    <div class="card-body">
                        <h2 class="car-title">${car.title}</h2>
                        <div class="vin-number">VIN: ${car.vin}</div>
                        <div class="details-grid">
                            <div class="detail-item"><span class="detail-label">📍 Location</span><span class="detail-value">${car.location}</span></div>
                            <div class="detail-item"><span class="detail-label">🛣 Odometer</span><span class="detail-value">${car.odometer}</span></div>
                            <div class="detail-item"><span class="detail-label">🗝 Status</span><span class="detail-value ${statusClass}">${car.status}</span></div>
                            <div class="detail-item"><span class="detail-label">🛠 Damage</span><span class="detail-value">${car.damage}</span></div>
                        </div>
                        <div class="card-footer">
                            <div class="price-box-inner"><span class="price-label">Final Price:</span><span class="price-value">${car.price}</span></div>
                            <a href="${car.lotUrl || 'lot.html?vin=' + car.vin}" class="view-lot-btn">VIEW LOT</a>
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. METODA DLA RESETU FILTRÓW
        function clearFilters() {
            document.getElementById('filterAuction').value = '';
            document.getElementById('filterMake').value = '';
            document.getElementById('filterDamage').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterState').value = '';
            document.getElementById('filterYearFrom').value = '';
            document.getElementById('filterYearTo').value = '';
            document.getElementById('filterMileageFrom').value = '';
            document.getElementById('filterMileageTo').value = '';
            updateModelOptions();
            fetchCarsFromAPI();
        }

        function updateFooterStats(total, copart, iaai) {
            document.getElementById('statTotalLots').textContent = total.toLocaleString();
            document.getElementById('statCopartLots').textContent = copart.toLocaleString();
            document.getElementById('statIaaiLots').textContent = iaai.toLocaleString();
        }

        // Inicjalne pobranie danych po załadowaniu strony
        window.addEventListener('DOMContentLoaded', fetchCarsFromAPI);
    </script>
</body>
</html>
