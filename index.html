<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINDOCTOR - US Auto Auctions Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px 20px 0 20px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 600px;
            background-image: url('https://images.unsplash.com/photo-1590497008432-598f04441de8?q=80&w=4091&auto=format&fit=crop');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 0.45;
            filter: contrast(110%) brightness(90%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            flex-grow: 1;
            width: 100%;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .top-search-section {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .top-search-form {
            display: flex;
            gap: 10px;
        }

        .top-search-input {
            flex-grow: 1;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
            align-items: start;
            margin-bottom: 50px;
        }

        .sidebar-filters {
            background-color: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            position: sticky;
            top: 20px;
        }

        .filter-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .filter-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
        }

        .filter-select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #e2e8f0;
            font-size: 0.85rem;
        }

        .btn {
            padding: 11px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.85rem;
            width: 100%;
        }

        .btn-primary { background-color: #38bdf8; color: #0f172a; }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .car-tile {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            background-color: #0f172a;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auction-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            background-color: #0053a0;
            color: #fff;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .car-title { font-size: 1.15rem; font-weight: 700; color: #ffffff; }
        .vin-number { font-size: 0.8rem; color: #94a3b8; font-family: monospace; margin-bottom: 14px; }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px;
            padding-top: 10px;
            border-top: 1px solid #334155;
            margin-bottom: 14px;
        }

        .detail-item { display: flex; flex-direction: column; }
        .detail-label { font-size: 0.65rem; text-transform: uppercase; color: #64748b; font-weight: 600; }
        .detail-value { font-size: 0.8rem; color: #cbd5e1; font-weight: 500; }

        .card-footer {
            margin-top: auto;
            background-color: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-value { font-size: 1.1rem; font-weight: 800; color: #38bdf8; }

        .view-lot-btn {
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 8px 12px;
            border-radius: 6px;
        }

        #statusMessage {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            background-color: #1e293b;
            border-radius: 12px;
            color: #94a3b8;
        }

        .site-footer {
            background-color: #0b1120;
            border-top: 1px solid #1e293b;
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-logo">
            <a href="index.html">
                <img src="logo_2.png" alt="VINDOCTOR" class="logo-img">
            </a>
        </div>

        <div class="top-search-section">
            <form class="top-search-form" action="lot.html" method="GET">
                <input type="text" name="vin" class="top-search-input" placeholder="Enter VIN number (e.g. 1FA6P8CF5M5123456)" required>
                <button type="submit" class="btn btn-primary" style="width: auto;">Search VIN</button>
            </form>
        </div>

        <div class="main-layout">
            <aside class="sidebar-filters">
                <div class="filter-title">
                    <span>Filters</span>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Auction House</label>
                    <select class="filter-select" id="filterAuction">
                        <option value="">All</option>
                        <option value="copart">Copart</option>
                        <option value="iaai">IAAI</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="fetchCarsFromApi()">Apply</button>
            </aside>

            <main class="car-grid" id="carGrid">
                <div id="statusMessage">Loading real-time vehicles from API...</div>
            </main>
        </div>

    </div>

    <footer class="site-footer">
        Ⓒ 2026 VINDOCTOR. All rights reserved
    </footer>

    <script>
        // ============================================================
        // TUTAJS WKLEJ SWÓJ KLUCZ/TOKEN OTRZYMANY OD APICAR.STORE
        // ============================================================
        const API_TOKEN = e9b16db5-1f33-4abb-81ca-aecad558b3ee; 
        const API_BASE_URL = 'https://api.apicar.store/v1'; // Lub adres podany w panelu

        async function fetchCarsFromApi() {
            const gridContainer = document.getElementById('carGrid');
            const statusMsg = document.getElementById('statusMessage');

            statusMsg.style.display = 'block';
            statusMsg.textContent = 'Fetching cars from ApiCar database...';
            document.querySelectorAll('.car-tile').forEach(el => el.remove());

            try {
                // Próba pobrania danych z użyciem tokena
                const response = await fetch(`${API_BASE_URL}/lots?token=${API_TOKEN}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'api-token': API_TOKEN
                    }
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                // Wyciągnięcie listy samochodów z odpowiedzi API
                const cars = data.data || data.items || data;

                if (!cars || cars.length === 0) {
                    statusMsg.textContent = 'No cars found in API response.';
                    return;
                }

                statusMsg.style.display = 'none';

                cars.forEach(car => {
                    const title = car.title || `${car.year || ''} ${car.make || ''} ${car.model || ''}`;
                    const vin = car.vin || 'N/A';
                    const auction = car.auction || 'AUCTION';
                    const location = car.location || car.state || 'N/A';
                    const mileage = car.mileage || car.odometer || 'N/A';
                    const status = car.status || car.run_condition || 'N/A';
                    const damage = car.primary_damage || car.damage || 'N/A';
                    const price = car.price || car.final_bid ? `$${car.price || car.final_bid} USD` : 'N/A';
                    const img = car.photo || car.image || (car.photos && car.photos[0]) || 'https://via.placeholder.com/600x400?text=No+Image';

                    const html = `
                        <div class="car-tile">
                            <a href="lot.html?vin=${vin}" class="card-image-wrapper">
                                <img src="${img}" alt="${title}" class="card-image">
                                <span class="auction-badge">${auction}</span>
                            </a>
                            <div class="card-body">
                                <h2 class="car-title">${title}</h2>
                                <div class="vin-number">VIN: ${vin}</div>
                                <div class="details-grid">
                                    <div class="detail-item"><span class="detail-label">📍 Location</span><span class="detail-value">${location}</span></div>
                                    <div class="detail-item"><span class="detail-label">🛣 Odometer</span><span class="detail-value">${mileage}</span></div>
                                    <div class="detail-item"><span class="detail-label">🗝 Status</span><span class="detail-value">${status}</span></div>
                                    <div class="detail-item"><span class="detail-label">🛠 Damage</span><span class="detail-value">${damage}</span></div>
                                </div>
                                <div class="card-footer">
                                    <div class="price-value">${price}</div>
                                    <a href="lot.html?vin=${vin}" class="view-lot-btn">VIEW LOT</a>
                                </div>
                            </div>
                        </div>
                    `;
                    gridContainer.insertAdjacentHTML('beforeend', html);
                });

            } catch (error) {
                console.error("API Fetch Error:", error);
                statusMsg.style.display = 'block';
                statusMsg.innerHTML = `<b style="color: #ef4444;">Could not connect to API.</b><br><small>Check if your API_TOKEN is correct in code or check CORS setup.</small>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchCarsFromApi();
        });
    </script>
</body>
</html>
