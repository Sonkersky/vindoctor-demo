<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarchiwizowane Auta z Licytacji</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stats span {
            color: var(--text-color);
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .car-tile {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .car-tile:hover {
            transform: translateY(-4px);
        }

        .card-image-wrapper {
            position: relative;
            height: 200px;
            background-color: #000;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auction-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            border-radius: 4px;
            background: #475569;
        }
        .auction-badge.copart { background: #d97706; }
        .auction-badge.iaai { background: #0284c7; }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .car-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .vin-number {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 4px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .price-box-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .price-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #22c55e;
        }

        .view-lot-btn {
            background-color: var(--accent);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .view-lot-btn:hover {
            background-color: var(--accent-hover);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Archiwum Pojazdów z Licytacji</h1>
        <div class="stats">
            <div>Wszystkie auta: <span id="statTotalLots">0</span></div>
            <div>Copart: <span id="statCopartLots">0</span></div>
            <div>IAAI: <span id="statIaaiLots">0</span></div>
        </div>
    </header>

    <main class="grid" id="carGrid">
        <div id="noResults" class="no-results">Ładowanie danych z API...</div>
    </main>

    <script>
        // KONFIGURACJA API
        const API_URL = 'https://doc.apicar.store/get-soldhistory-lots-34459539e0'; 
        const API_TOKEN = 'e9b16db5-1f33-4abb-81ca-aecad558b3ee';

        async function fetchSoldCars() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${API_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status}`);
                }

                const result = await response.json();
                const cars = result.data || [];

                // Zapisujemy pobrane auta w localStorage, aby strona szczegółów (lot.html) mogła do nich sięgnąć
                localStorage.setItem('cachedCarsData', JSON.stringify(cars));

                renderCarGrid(cars);
                calculateStats(cars);

            } catch (error) {
                console.error('Błąd pobierania:', error);
                document.getElementById('noResults').innerHTML = '<h3>Nie udało się załadować danych z API.</h3><p>Sprawdź konfigurację tokenu lub połączenie.</p>';
            }
        }

        function renderCarGrid(cars) {
            const grid = document.getElementById('carGrid');
            const noResults = document.getElementById('noResults');
            
            const existingTiles = grid.querySelectorAll('.car-tile');
            existingTiles.forEach(tile => tile.remove());

            if (!cars || cars.length === 0) {
                noResults.style.display = 'block';
                noResults.textContent = 'Brak pojazdów do wyświetlenia.';
                return;
            }

            noResults.style.display = 'none';

            cars.forEach(car => {
                const year = car.year || '';
                const title = car.title || `${year} ${car.make} ${car.model}`;
                const vin = car.vin || '';
                const auction = car.base_site ? car.base_site.toLowerCase() : 'iaai';
                const location = car.location || 'USA';
                const odometer = car.odometer ? car.odometer.toLocaleString() + ' mi' : 'N/A';
                const status = car.status || 'Sold';
                const damage = car.damage_pr || 'N/A';
                const price = car.purchase_price ? `$${car.purchase_price.toLocaleString()} USD` : 'Zapytaj o cenę';
                
                const imgSrc = (car.link_img_small && car.link_img_small.length > 0) 
                    ? car.link_img_small[0] 
                    : 'https://images.unsplash.com/photo-1590497008432-598f04441de8?auto=format&fit=crop&w=600&q=80';

                const tile = document.createElement('div');
                tile.className = 'car-tile';

                tile.innerHTML = `
                    <a href="lot.html?vin=${vin}" class="card-image-wrapper">
                        <img src="${imgSrc}" alt="${title}" class="card-image">
                        <span class="auction-badge ${auction}">${auction.toUpperCase()}</span>
                    </a>
                    <div class="card-body">
                        <h2 class="car-title">${title}</h2>
                        <div class="vin-number">VIN: ${vin}</div>
                        <div class="details-grid">
                            <div class="detail-item"><span class="detail-label">📍 Lokalizacja</span><span class="detail-value">${location}</span></div>
                            <div class="detail-item"><span class="detail-label">🛣 Przebieg</span><span class="detail-value">${odometer}</span></div>
                            <div class="detail-item"><span class="detail-label">🗝 Status</span><span class="detail-value">${status}</span></div>
                            <div class="detail-item"><span class="detail-label">🛠 Uszkodzenie</span><span class="detail-value">${damage}</span></div>
                        </div>
                        <div class="card-footer">
                            <div class="price-box-inner"><span class="price-label">Cena końcowa:</span><span class="price-value">${price}</span></div>
                            <a href="lot.html?vin=${vin}" class="view-lot-btn">ZOBACZ SZCZEGÓŁY</a>
                        </div>
                    </div>
                `;

                grid.appendChild(tile);
            });
        }

        function calculateStats(cars) {
            let total = cars.length;
            let copart = cars.filter(c => c.base_site === 'copart').length;
            let iaai = cars.filter(c => c.base_site === 'iaai').length;

            document.getElementById('statTotalLots').textContent = total;
            document.getElementById('statCopartLots').textContent = copart;
            document.getElementById('statIaaiLots').textContent = iaai;
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchSoldCars();
        });
    </script>
</body>
</html>
